async function generarBoleta(){

  if(generandoBoleta) return;

  const nombre = document.getElementById("clienteNombre").value.trim();
  const dni = document.getElementById("clienteDni").value.trim();
  const direccion = document.getElementById("clienteDireccion").value.trim();
  const celular = document.getElementById("clienteCelular").value.trim();

  const clienteFinal = nombre || "Cliente General";
  const dniFinal = dni || "-";

  // 🛒 obtener carrito
  let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

  if(carrito.length === 0){
    alert("El carrito está vacío");
    return;
  }

  generandoBoleta = true;
  let numeroFormateado;
  try{
    numeroFormateado = await obtenerNumeroBoleta();
  }catch(e){
    console.error("No se pudo obtener correlativo", e);
    generandoBoleta = false;

  }

  let total = 0;

  let filas = carrito.map(item => {
    const sub = item.p * item.cantidad;
    total += sub;

    // Formato térmico: evita comprimir 5 columnas en un ticket de 80 mm.
    return `
      <tr>
        <td colspan="3" style="padding:5px 0 1px 0; font-size:15px; font-weight:bold; text-align:left;">${item.n}</td>
      </tr>
      <tr>
        <td style="padding:1px 0 5px 0; font-size:13px; text-align:left; white-space:nowrap;">${item.codigo}</td>
        <td style="padding:1px 4px 5px 4px; font-size:14px; text-align:center; white-space:nowrap;">${item.cantidad} x S/. ${item.p.toFixed(2)}</td>
        <td style="padding:1px 0 5px 0; font-size:14px; font-weight:bold; text-align:right; white-space:nowrap;">S/. ${sub.toFixed(2)}</td>
      </tr>
    `;
  }).join("");

  // 📅 fecha actual
 const fecha = new Date().toLocaleDateString('es-PE', {
  year: 'numeric',
  month: '2-digit',
  day: '2-digit'
}) + ' ' + new Date().toLocaleTimeString();



// guardar siguiente número

const html = `
<div id="boletaPDF" style="

console.log("Boleta guardada ✅");

function imprimirBoleta(){
  // En Android no abrimos otra pestaña ni usamos window.print().
  // Se genera el ticket térmico y se entrega al menú Compartir,
  // donde PrinterA puede recibirlo directamente.
  compartirPrinterA();
}

async function crearImagenTicket80mm(){
  const boleta = document.querySelector("#boletaPDF");

  if(!boleta){
    throw new Error("No se encontró la boleta");
  }

  // Render de alta resolución y salida normalizada a 576 puntos.
  // 576 dots es el ancho imprimible típico de una térmica de 80 mm / 203 dpi.
  const canvasFuente = await html2canvas(boleta, {
    scale: 3,
    backgroundColor: "#ffffff",
    useCORS: true,
    logging: false,
    windowWidth: Math.max(document.documentElement.clientWidth, 900)
  });

  const anchoSalida = 576;
  const altoSalida = Math.ceil(canvasFuente.height * anchoSalida / canvasFuente.width);
  const canvas = document.createElement("canvas");
  canvas.width = anchoSalida;
  canvas.height = altoSalida;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(canvasFuente, 0, 0, canvas.width, canvas.height);

  return canvas;
}

async function crearPDFTicket80mm(){
  const { jsPDF } = window.jspdf;
  const canvas = await crearImagenTicket80mm();
  const imgData = canvas.toDataURL("image/png");

  // Página REAL de 80 mm, sin A4 y sin márgenes externos.
  const pageWidth = 80;
  const pageHeight = canvas.height * pageWidth / canvas.width;

  const pdf = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: [pageWidth, pageHeight],
    compress: true
  });

  pdf.addImage(imgData, "PNG", 0, 0, pageWidth, pageHeight, undefined, "FAST");
  return pdf;
}

async function compartirPrinterA(){
  try{
    // Para térmicas es preferible compartir la imagen rasterizada al ancho
    // exacto del cabezal: evita que un visor PDF vuelva a escalar el ticket.
    const canvas = await crearImagenTicket80mm();
    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error("No se pudo crear la imagen")), "image/png", 1);
    });
    const file = new File([blob], "boleta-80mm.png", { type: "image/png" });

    if(navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))){
      await navigator.share({
        title: "Boleta 80 mm",
        files: [file]
      });
      return;
    }

    // Respaldo para navegadores sin Web Share de archivos: descarga directa,
    // sin abrir ninguna pestaña adicional.
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "boleta-80mm.png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){
    if(e && e.name === "AbortError") return;
    console.error(e);
    alert("No se pudo preparar el ticket de 80 mm");
  }
}

async function descargarImagen(){
  try{
    const canvas = await crearImagenTicket80mm();
    const link = document.createElement("a");
    link.download = "boleta-80mm.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }catch(e){
    console.error(e);
    alert("No se pudo generar la imagen de la boleta");
  }
}

async function descargarPDF(){
  try{
    const pdf = await crearPDFTicket80mm();
    pdf.save("boleta-80mm.pdf");
  }catch(e){
    console.error(e);
    alert("No se pudo generar el PDF de la boleta");
  }
}


async function cargarDatosTienda(){

    if(doc.exists){

      // 🔥 detecta automáticamente los nombres de campos
      nombreTienda = data.nombre || data.storeName || "Mi Tienda";
      logoTienda = data.logo || data.storeLogo || "";
    }

  }catch(e){
    console.error(e);
  }

  console.log("Boleta enviada a Firebase");
}

  window.location.href = "index.html";

async function obtenerNumeroBoleta(){
  const ref = db.collection("config").doc("contadorBoletas");

  const numero = await db.runTransaction(async transaction => {
    const doc = await transaction.get(ref);
    const actual = doc.exists ? Number(doc.data().valor || 0) : 0;
    const siguiente = actual + 1;
    transaction.set(ref, { valor: siguiente }, { merge: true });
    return siguiente;
  });

  return "B-" + numero.toString().padStart(5,"0");
}
