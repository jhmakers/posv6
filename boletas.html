<body>

let adminPassword = "1234";
let generandoBoleta = false;

// 🔑 cargar contraseña desde Firebase
async function cargarPassword(){
  try{
    const doc = await db.collection("config").doc("admin").get();
    if(doc.exists && doc.data().password){
      adminPassword = doc.data().password;
    }
  }catch(err){
    console.error(err);
  }
}

// 🔐 verificar acceso
async function verificarAcceso(){
  const input = document.getElementById("passBoletas").value.trim();

  if(input === adminPassword){
    localStorage.setItem("adminAuth","ok"); // 🔥 guardar sesión
    document.getElementById("loginBoletas").style.display = "none";
    document.getElementById("contenidoBoletas").style.display = "block";
  } else {
    alert("❌ Contraseña incorrecta");
  }
}

// 🔄 mantener sesión al recargar
function verificarSesion(){
  if(localStorage.getItem("adminAuth") === "ok"){
    document.getElementById("loginBoletas").style.display = "none";
    document.getElementById("contenidoBoletas").style.display = "block";
  }
}

// 🚀 iniciar
document.addEventListener("DOMContentLoaded", async () => {
  await cargarPassword();
  await cargarDatosTienda(); // 👈 ESTA LÍNEA FALTABA
  verificarSesion();
});

function cerrarSesion(){
  localStorage.removeItem("adminAuth");
  location.reload();
}


async function generarBoleta(){

  if(generandoBoleta) return;

  const nombre = document.getElementById("clienteNombre").value.trim();
  const dni = document.getElementById("clienteDni").value.trim();
  const direccion = document.getElementById("clienteDireccion").value.trim();
  const celular = document.getElementById("clienteCelular").value.trim();

  const clienteFinal = nombre || "Cliente General";
  const dniFinal = dni || "-";

  // 🛒 obtener carrito
  let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

  if(carrito.length === 0){
    alert("El carrito está vacío");
    return;
  }

  generandoBoleta = true;
  let numeroFormateado;
  try{
    numeroFormateado = await obtenerNumeroBoleta();
  }catch(e){
    console.error("No se pudo obtener correlativo", e);
    generandoBoleta = false;
    alert("No se pudo generar el número de boleta");
    return;
  }

  let total = 0;

  let filas = carrito.map(item => {
    const sub = item.p * item.cantidad;
    total += sub;

    return `
      <tr>
        <td>${item.n}</td>
        <td>${item.codigo}</td>
        <td>S/. ${item.p.toFixed(2)}</td>
        <td>${item.cantidad}</td>
        <td>S/. ${sub.toFixed(2)}</td>
      </tr>
    `;
  }).join("");

  // 📅 fecha actual
 const fecha = new Date().toLocaleDateString('es-PE', {
  year: 'numeric',
  month: '2-digit',
  day: '2-digit'
}) + ' ' + new Date().toLocaleTimeString();



// guardar siguiente número

const html = `
<div id="boletaPDF" style="
  background:#fff;
  color:#000;
  padding:10px;
  border-radius:8px;
  font-size:15px;
  width:72mm;
  max-width:72mm;
  box-sizing:border-box;
  margin:auto;
  font-family:Arial, sans-serif;
">

  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #000; padding-bottom:8px;">

    <!-- IZQUIERDA: LOGO + NOMBRE -->
    <div style="display:flex; align-items:center; gap:10px;">
      
      ${logoTienda ? `
        <div style="width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid #000;">
          <img src="${logoTienda}" style="width:100%;height:100%;object-fit:cover;">
        </div>
      ` : ""}

      <div style="font-size:14px; font-weight:bold;">
        ${nombreTienda}
      </div>

    </div>

    <!-- DERECHA: BOLETA + NUMERO -->
    <div style="text-align:right;">
      <div style="font-size:13px; font-weight:bold;">
        🧾 Boleta de Venta
      </div>
      <div style="font-size:11px;">
        Nº ${numeroFormateado}
      </div>
    </div>

  </div>
    <p><b>Fecha:</b> ${fecha}</p>

    <hr>

    <p><b>Cliente:</b> ${clienteFinal}</p>
    <p><b>DNI:</b> ${dniFinal}</p>
    <p><b>Dirección:</b> ${direccion || '-'}</p>
    <p><b>Celular:</b> ${celular || '-'}</p>

    <hr>

    <table style="width:100%; border-collapse:collapse; font-size:12px;">
      <thead>
        <tr>
          <th style="border-bottom:1px solid #000;">Prod</th>
          <th style="border-bottom:1px solid #000;">Cod</th>
          <th style="border-bottom:1px solid #000;">P</th>

          <th style="border-bottom:1px solid #000;">Sub</th>
        </tr>
      </thead>
      <tbody>

      </tbody>
    </table>

   <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:14px;">
  <span>TOTAL</span>
  <span>S/. ${total.toFixed(2)}</span>
</div>

    <p style="text-align:center; font-size:11px;">Gracias por su compra</p>

`;

  const cont = document.getElementById("boletaResultado");
  cont.innerHTML = html;
  cont.style.display = "block";
  document.getElementById("accionesBoleta").style.display = "block";


try{
  await db.collection("boletas").doc(numeroFormateado).set({

    cliente: clienteFinal,
    dni: dniFinal,

    productos: carrito,

      fecha: new Date().toISOString(),

      total: total,
      descuento: carrito.reduce((a,b)=>a+((b.descuentoAplicado||0)*b.cantidad),0)
    });
    localStorage.setItem("ventasDia", JSON.stringify(ventas));
  }catch(e){
    console.error("No se pudo guardar historial", e);
  }

console.log("Boleta guardada ✅");
  localStorage.setItem("carrito", "[]");
  generandoBoleta = false;
  alert(`✅ Boleta ${numeroFormateado} guardada correctamente`);

}catch(e){
  console.error("Error al guardar ❌", e);
  generandoBoleta = false;
  alert("Error al guardar la boleta");
}
}

async function crearPDFTicket80mm(){
  const { jsPDF } = window.jspdf;
  const boleta = document.querySelector("#boletaPDF");

  if(!boleta){
    throw new Error("No se encontró la boleta");
  }

  const canvas = await html2canvas(boleta, {
    scale: 3,
    backgroundColor: "#ffffff",
    useCORS: true,
    logging: false
  });

  const imgData = canvas.toDataURL("image/png");

  // Papel térmico de 80 mm con 3 mm de margen a cada lado.
  const pageWidth = 80;
  const margin = 3;
  const imgWidth = pageWidth - (margin * 2); // 74 mm útiles
  const imgHeight = canvas.height * imgWidth / canvas.width;
  const pageHeight = imgHeight + (margin * 2);

  const pdf = new jsPDF({
    orientation: "portrait",
    unit: "mm",
    format: [pageWidth, pageHeight],
    compress: true
  });

  pdf.addImage(imgData, "PNG", margin, margin, imgWidth, imgHeight, undefined, "FAST");
  return pdf;
}

async function compartirPrinterA(){
  try{
    const pdf = await crearPDFTicket80mm();
    const blob = pdf.output("blob");
    const file = new File([blob], "boleta-80mm.pdf", { type: "application/pdf" });

    if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({
        title: "Boleta 80mm",
        text: "Imprimir boleta térmica de 80 mm",
        files: [file]
      });
      return;
    }

    // Si el navegador no permite compartir archivos, descarga el PDF exacto.
    pdf.save("boleta-80mm.pdf");
    alert("Se descargó la boleta en 80 mm. Ábrela y compártela con PrinterA.");
  }catch(e){
    console.error(e);
    alert("No se pudo preparar la boleta para PrinterA");
  }
}

function descargarImagen(){
  const boleta = document.querySelector("#boletaPDF");

  if(!boleta){
    alert("No se encontró la boleta");
    return;
  }

  html2canvas(boleta, {
    scale: 3,
    backgroundColor: "#ffffff",
    useCORS: true
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "boleta-80mm.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

async function descargarPDF(){
  try{
    const pdf = await crearPDFTicket80mm();
    pdf.save("boleta-80mm.pdf");
  }catch(e){
    console.error(e);
    alert("No se pudo generar el PDF de la boleta");
  }
}


async function cargarDatosTienda(){
  try{
    const doc = await db.collection("config").doc("tienda").get();

    if(doc.exists){
      const data = doc.data();

      // 🔥 detecta automáticamente los nombres de campos
      nombreTienda = data.nombre || data.storeName || "Mi Tienda";
      logoTienda = data.logo || data.storeLogo || "";
    }

  }catch(e){
    console.error(e);
  }

  console.log("Boleta enviada a Firebase");
}

  window.location.href = "index.html";

async function obtenerNumeroBoleta(){
  const ref = db.collection("config").doc("contadorBoletas");

  const numero = await db.runTransaction(async transaction => {
    const doc = await transaction.get(ref);
    const actual = doc.exists ? Number(doc.data().valor || 0) : 0;
    const siguiente = actual + 1;
    transaction.set(ref, { valor: siguiente }, { merge: true });
    return siguiente;
  });

  return "B-" + numero.toString().padStart(5,"0");
}
